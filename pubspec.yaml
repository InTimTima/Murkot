name: tujh_messenger
description: Мессенджер с авторизацией и профилем пользователя.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.9.1
  url_launcher: ^6.3.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/murkot_icon.png
    - assets/branding/murkot_stretch_cat.png
