<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Murkot</title>
    <script>
      // SPA fallback (GitHub Pages / static hosts): remember deep link, then load app root.
      sessionStorage.setItem('murkot_redirect', location.href);
      var base = location.pathname.indexOf('/Murkot') === 0 ? '/Murkot/' : '/';
      location.replace(base);
    </script>
  </head>

</html>
