<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tujh_messenger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tujh_messenger</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="tujh-boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,system-ui,sans-serif;background:#0f1220;color:#e8eaf6;">
    <div style="text-align:center">
      <div style="width:36px;height:36px;margin:0 auto 12px;border:3px solid #3a3f5c;border-top-color:#7b87ff;border-radius:50%;animation:tujhspin .7s linear infinite"></div>
      <div style="font-size:14px;opacity:.85">Загрузка Tujh…</div>
    </div>
  </div>
  <style>
    @keyframes tujhspin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('tujh-boot');
      if (el) el.remove();
    });
  </script>
  <script>
    // Voice note recorder (MediaRecorder → base64).
    let _tujhVoiceRecorder = null;
    let _tujhVoiceChunks = [];
    let _tujhVoiceStartedAt = 0;
    let _tujhVoiceStream = null;

    window.tujhVoiceStart = async function () {
      if (!navigator.mediaDevices?.getUserMedia) return false;
      _tujhVoiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      _tujhVoiceChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';
      _tujhVoiceRecorder = new MediaRecorder(_tujhVoiceStream, { mimeType: mime });
      _tujhVoiceRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) _tujhVoiceChunks.push(e.data);
      };
      _tujhVoiceStartedAt = Date.now();
      _tujhVoiceRecorder.start();
      return true;
    };

    window.tujhVoiceStop = async function () {
      if (!_tujhVoiceRecorder) return null;
      const recorder = _tujhVoiceRecorder;
      const mimeType = recorder.mimeType || 'audio/webm';
      const blob = await new Promise((resolve) => {
        recorder.onstop = () => resolve(new Blob(_tujhVoiceChunks, { type: mimeType }));
        recorder.stop();
      });
      (_tujhVoiceStream?.getTracks() || []).forEach((t) => t.stop());
      _tujhVoiceRecorder = null;
      _tujhVoiceStream = null;
      const durationMs = Date.now() - _tujhVoiceStartedAt;
      const buffer = await blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return {
        base64: btoa(binary),
        mimeType,
        durationMs,
      };
    };

    window.tujhVoiceCancel = async function () {
      try {
        if (_tujhVoiceRecorder && _tujhVoiceRecorder.state !== 'inactive') {
          _tujhVoiceRecorder.stop();
        }
      } catch (_) {}
      (_tujhVoiceStream?.getTracks() || []).forEach((t) => t.stop());
      _tujhVoiceRecorder = null;
      _tujhVoiceStream = null;
      _tujhVoiceChunks = [];
    };

    // Web Push helper for Flutter (stores subscription via NotificationService).
    window.tujhRegisterWebPush = async function (vapidPublicKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return null;
      }
      const reg = await navigator.serviceWorker.register('push-sw.js');
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const padding = '='.repeat((4 - (vapidPublicKey.length % 4)) % 4);
        const base64 = (vapidPublicKey + padding)
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const raw = atob(base64);
        const key = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) key[i] = raw.charCodeAt(i);
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: key,
        });
      }
      return JSON.stringify(sub.toJSON());
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
