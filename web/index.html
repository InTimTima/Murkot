<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Murkot — мессенджер со вкусом свежего сока.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Murkot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Murkot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="murkot-boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,system-ui,sans-serif;background:linear-gradient(160deg,#FFF6E8,#FFD27A 55%,#F1891E);color:#5A3010;">
    <div style="text-align:center">
      <div style="width:36px;height:36px;margin:0 auto 12px;border:3px solid rgba(90,48,16,.25);border-top-color:#F1891E;border-radius:50%;animation:murkotspin .7s linear infinite"></div>
      <div style="font-size:14px;opacity:.9;font-weight:600;letter-spacing:.08em">Загрузка Murkot…</div>
    </div>
  </div>
  <style>
    @keyframes murkotspin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('murkot-boot');
      if (el) el.remove();
    });
  </script>
  <script>
    // Voice note recorder (MediaRecorder → base64).
    let _murkotVoiceRecorder = null;
    let _murkotVoiceChunks = [];
    let _murkotVoiceStartedAt = 0;
    let _murkotVoiceStream = null;

    window.murkotVoiceStart = async function () {
      if (!navigator.mediaDevices?.getUserMedia) return false;
      _murkotVoiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      _murkotVoiceChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';
      _murkotVoiceRecorder = new MediaRecorder(_murkotVoiceStream, { mimeType: mime });
      _murkotVoiceRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) _murkotVoiceChunks.push(e.data);
      };
      _murkotVoiceStartedAt = Date.now();
      _murkotVoiceRecorder.start();
      return true;
    };

    window.murkotVoiceStop = async function () {
      if (!_murkotVoiceRecorder) return null;
      const recorder = _murkotVoiceRecorder;
      const mimeType = recorder.mimeType || 'audio/webm';
      const blob = await new Promise((resolve) => {
        recorder.onstop = () => resolve(new Blob(_murkotVoiceChunks, { type: mimeType }));
        recorder.stop();
      });
      (_murkotVoiceStream?.getTracks() || []).forEach((t) => t.stop());
      _murkotVoiceRecorder = null;
      _murkotVoiceStream = null;
      const durationMs = Date.now() - _murkotVoiceStartedAt;
      const buffer = await blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return {
        base64: btoa(binary),
        mimeType,
        durationMs,
      };
    };

    window.murkotVoiceCancel = async function () {
      try {
        if (_murkotVoiceRecorder && _murkotVoiceRecorder.state !== 'inactive') {
          _murkotVoiceRecorder.stop();
        }
      } catch (_) {}
      (_murkotVoiceStream?.getTracks() || []).forEach((t) => t.stop());
      _murkotVoiceRecorder = null;
      _murkotVoiceStream = null;
      _murkotVoiceChunks = [];
    };

    // Web Push helper for Flutter (stores subscription via NotificationService).
    window.murkotRegisterWebPush = async function (vapidPublicKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return null;
      }
      const reg = await navigator.serviceWorker.register('push-sw.js');
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const padding = '='.repeat((4 - (vapidPublicKey.length % 4)) % 4);
        const base64 = (vapidPublicKey + padding)
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const raw = atob(base64);
        const key = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) key[i] = raw.charCodeAt(i);
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: key,
        });
      }
      return JSON.stringify(sub.toJSON());
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
